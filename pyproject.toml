[build-system]
requires = ["setuptools==74.1.2", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recsys"
version = "0.1.0"
description = "A reproducible MovieLens 25M recommendation system."
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.13.2",
    "fastapi==0.112.2",
    "mlflow==2.15.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "plotly==5.23.0",
    "psycopg[binary]==3.2.1",
    "pydantic==2.8.2",
    "scikit-learn==1.5.1",
    "scipy==1.13.1",
    "sqlalchemy==2.0.32",
    "streamlit==1.37.1",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "pre-commit==3.8.0",
    "pytest==8.3.2",
    "httpx==0.27.2",
    "ruff==0.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
