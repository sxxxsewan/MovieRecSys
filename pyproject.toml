[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recsys"
version = "0.1.0"
description = "A reproducible MovieLens 25M recommendation system."
requires-python = ">=3.13"
dependencies = [
    "alembic==1.14.1",
    "fastapi==0.115.6",
    "mlflow==2.18.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "plotly==5.23.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "sqlalchemy==2.0.36",
    "streamlit==1.41.1",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.9.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
