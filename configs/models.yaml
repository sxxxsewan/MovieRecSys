models:
  popularity:
    metric: rating_count
    smoothing: 10.0
  item_knn:
    k_neighbors: 50
    min_similarity: 0.0
  als:
    factors: 32
    regularization: 0.1
    iterations: 8
    seed: 42
    workers: 12
  content_based:
    max_features: 20000
    svd_components: 128
  hybrid:
    als_weight: 0.7
    content_weight: 0.3
    tune_on: validation
    candidate_als_weights: [0.0, 0.25, 0.5, 0.75, 1.0]
